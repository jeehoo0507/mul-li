<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>저항으로 계산하는 신경망</title>
<meta name="description" content="손글씨 숫자를 고르면 옴의 법칙과 키르히호프 법칙으로 계산하는 아날로그 크로스바 회로가 답을 내는 과정을 단계별로 보여줍니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--line:#222;--line2:#363636;
  --fg:#ececec;--muted:#8f8f8f;--dim:#555;
  --volt:#ff8a4c;--amp:#6d9bff;--ok:#5fd38d;--bad:#ff5d6c;
  --sans:"IBM Plex Sans KR",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amp);outline-offset:2px}
.wrap{max-width:1600px;margin:0 auto;padding:18px 22px 28px}

header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
h1 b{color:var(--volt);font-weight:700} h1 i{color:var(--amp);font-style:normal}
.dots{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.dots span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--c)}

.strip{display:flex;gap:5px;margin-top:0;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.strip button{flex:0 0 auto;width:40px;height:40px;border:1px solid var(--line2);border-radius:5px;background:#000;padding:0;cursor:pointer;position:relative;overflow:hidden}
.strip button canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.strip button[aria-pressed="true"]{border-color:var(--volt);box-shadow:0 0 0 1px var(--volt)}
.strip button.wrong::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--bad)}

.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.seg{display:flex;background:#0f0f0f;border:1px solid var(--line);border-radius:7px;padding:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:5px;cursor:pointer;color:var(--muted);font-size:13px;white-space:nowrap}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"],.seg button[aria-current="step"]{background:#262626;color:var(--fg)}
.seg button.done{color:#bdbdbd}
#steps button[aria-current="step"]{box-shadow:inset 0 -2px 0 var(--volt)}
.sp{flex:1}
.ibtn{border:1px solid var(--line2);background:#0f0f0f;border-radius:7px;height:32px;min-width:32px;padding:0 11px;cursor:pointer;font-size:13px;white-space:nowrap}
.ibtn:hover{border-color:var(--muted)}
.ibtn.play{background:var(--fg);color:#000;border-color:var(--fg);font-weight:500;min-width:62px}
.ibtn[aria-expanded="true"]{border-color:var(--volt);color:var(--volt)}

.main{display:grid;grid-template-columns:168px minmax(0,1fr);gap:14px;margin-top:10px}
.main.open{grid-template-columns:168px minmax(0,1fr) 250px}
.main:not(.open)>.drawer{display:none}
.padcol{display:flex;flex-direction:column;gap:8px}
.pad{position:relative;width:168px;height:168px;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#000;touch-action:none;cursor:crosshair}
.pad.on{border-color:var(--volt);box-shadow:0 0 0 1px var(--volt)}
.pad canvas{width:100%;height:100%;display:block}
.pad .ph{position:absolute;inset:0;display:grid;place-items:center;color:#2c2c2c;font:500 64px var(--mono);pointer-events:none;transition:opacity .2s}
.pad.inked .ph{opacity:0}
.padbar{display:flex;gap:6px;align-items:center}
.padbar canvas{width:40px;height:40px;border:1px solid var(--line2);border-radius:5px;image-rendering:pixelated;background:#000}
.padbar .ibtn{flex:1}
.stage{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000}
#cv{width:100%;display:block;cursor:crosshair}
.info{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;border-top:1px solid var(--line);padding:10px 14px;min-height:42px}
.eq{display:contents;font:500 13px var(--mono);color:var(--fg)}
.eq span{white-space:nowrap;font:500 13px var(--mono)}
.eq .v{color:var(--volt)} .eq .a{color:var(--amp)} .eq .g{color:var(--ok)} .eq .m{color:var(--muted)}
.tag{display:none}

.drawer{overflow:hidden;min-width:0}
.drawer .in{width:250px;border:1px solid var(--line);border-radius:10px;padding:14px}
.ctl{margin-bottom:13px}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:3px}
.ctl output{font:500 12.5px var(--mono);color:var(--volt)}
input[type=range]{width:100%;accent-color:var(--volt)}
select{width:100%;background:#111;border:1px solid var(--line2);border-radius:5px;padding:4px 8px}
.row2{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13px}
.switch{appearance:none;width:34px;height:19px;border-radius:999px;background:#2a2a2a;position:relative;cursor:pointer;transition:background .15s;flex:0 0 auto}
.switch::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#bbb;top:2px;left:2px;transition:left .15s}
.switch:checked{background:var(--amp)}
.switch:checked::after{left:17px;background:#fff}
.drawer .seg{width:100%;margin-bottom:12px}
.drawer .seg button{flex:1}

.res{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:22px;margin-top:14px;align-items:end;transition:opacity .45s ease,transform .45s ease}
.res.wait{opacity:0;visibility:hidden;transform:translateY(6px)}
.k{font-size:12px;color:var(--muted);margin-bottom:6px}
.predwrap{display:flex;gap:16px;align-items:flex-end}
.pred{font:500 64px var(--mono);line-height:.9;min-width:52px;text-align:center;letter-spacing:-.04em}
.pred small{display:block;font:500 12px var(--mono);color:var(--muted);letter-spacing:0;margin-top:6px}
.probs{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:4px;height:74px;align-items:end}
.pc{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center}
.pc .d{position:absolute;bottom:14px;left:12%;right:12%;border:1px solid #cfcfcf;border-bottom:0;border-radius:2px 2px 0 0}
.pc .an{position:absolute;bottom:14px;left:30%;right:30%;background:var(--volt);border-radius:2px 2px 0 0}
.pc span{font:500 11px var(--mono);color:var(--dim)}
.pc.t span{color:var(--fg)}
.big{display:flex;gap:18px;align-items:baseline}
.big b{font:500 36px var(--mono);letter-spacing:-.03em;line-height:1}
.big small{font:500 15px var(--mono);color:var(--muted)}
.lerr{display:flex;gap:8px;align-items:flex-end;height:74px}
.lerr div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.lerr i{width:60%;background:var(--amp);border-radius:2px 2px 0 0;min-height:2px}
.lerr span{font:500 11px var(--mono);color:var(--muted)}
.lerr em{font:500 12px var(--mono);font-style:normal;color:var(--fg)}

@media (max-width:900px){
  .main,.main.open{grid-template-columns:1fr}
  .padcol{flex-direction:row;align-items:flex-end}
  .drawer .in{width:auto}
  .res{grid-template-columns:1fr;gap:16px}
  .dots{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<div class="strip" id="gallery" aria-label="숫자"></div>

<div class="bar">
  <div class="seg" role="tablist" id="tabs"></div>
  <div class="seg" id="steps"></div>
  <div class="sp"></div>
  <button class="ibtn" id="prev" aria-label="이전">◀</button>
  <button class="ibtn play" id="play" aria-label="재생">▶</button>
  <button class="ibtn" id="next" aria-label="다음">▶|</button>
  <div class="seg" id="presetBar">
    <button data-preset="ideal" title="이상적인 칩">이상</button><button data-preset="nominal" title="보통 칩">보통</button><button data-preset="bad" title="열악한 칩">열악</button>
  </div>
  <button class="ibtn" id="gear" aria-expanded="false" aria-controls="drawer" aria-label="칩 설정" title="칩 설정">⚙</button>
</div>

<div class="main" id="main">
  <div class="padcol">
    <div class="pad" id="pad" title="여기에 숫자를 그리세요"><canvas id="padcv" width="256" height="256" aria-label="숫자 그리기"></canvas><div class="ph">✎</div></div>
    <div class="padbar"><canvas id="pad8" width="8" height="8" title="8×8로 줄인 입력"></canvas><button class="ibtn" id="padclr" aria-label="지우기" title="지우기">✕</button></div>
  </div>
  <div class="stage">
    <canvas id="cv" aria-label="크로스바 회로 시각화"></canvas>
    <div class="info"><div class="tag" id="exTitle"></div><div class="eq" id="exEq"></div></div>
  </div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="in">
      <div class="seg" id="model"><button data-m="std" aria-pressed="true" title="일반 학습">기본</button><button data-m="hwa" aria-pressed="false" title="하드웨어 인식 학습">HWA</button></div>
      <div class="ctl row2"><span title="열별 보정">보정</span><input type="checkbox" class="switch" id="cal"></div>
      <div class="ctl"><label for="sigma" title="소자마다 컨덕턴스가 다르게 써지는 정도">σ <output id="o_sigma"></output></label><input type="range" id="sigma" min="0" max="40" step="1"></div>
      <div class="ctl"><label for="levels" title="소자가 표현할 수 있는 컨덕턴스 단계 수">단계 <output id="o_levels"></output></label>
        <select id="levels"><option value="2">2</option><option value="4">4</option><option value="8">8</option><option value="16">16</option><option value="32">32</option><option value="64">64</option><option value="0">∞</option></select></div>
      <div class="ctl"><label for="adc" title="열 전류를 숫자로 바꿀 때의 정밀도">ADC <output id="o_adc"></output></label><input type="range" id="adc" min="2" max="10" step="1"></div>
      <div class="ctl"><label for="dac" title="입력값을 행 전압으로 바꿀 때의 정밀도">DAC <output id="o_dac"></output></label>
        <select id="dac"><option value="4">4</option><option value="6">6</option><option value="8">8</option><option value="0">∞</option></select></div>
      <div class="ctl"><label for="beta" title="배선 저항 때문에 가장 먼 셀에서 잃는 전압">IR <output id="o_beta"></output></label><input type="range" id="beta" min="0" max="30" step="1"></div>
      <div class="ctl"><label for="read" title="ADC 풀스케일 대비 무작위 잡음">잡음 <output id="o_read"></output></label><input type="range" id="read" min="0" max="5" step="0.1"></div>
      <div class="row2"><output id="o_seed" style="font:500 12.5px var(--mono);color:var(--muted)"></output><button class="ibtn" id="newchip" title="다른 칩" aria-label="다른 칩">↻</button></div>
    </div>
  </aside>
</div>

<div class="res wait" id="res" aria-live="polite">
  <div class="predwrap"><div class="pred" id="pred" title="칩이 예측한 숫자"></div><div class="probs" id="probs"></div></div>
  <div><div class="big" title="테스트 540장 정답률 (디지털 / 칩)"><small id="accD">–</small><b id="accA">–</b></div></div>
  <div><div class="lerr" id="lerr" title="층별 오차"></div></div>
</div>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(() => {
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const SIZES = D.sizes, NIN = SIZES[0], NTE = D.yte.length, NCAL = D.Xcal.length / NIN;
const Xte = [], Xcal = [];
for (let n = 0; n < NTE; n++) Xte.push(Float64Array.from(D.Xte.slice(n * NIN, (n + 1) * NIN), v => v / 16));
for (let n = 0; n < NCAL; n++) Xcal.push(Float64Array.from(D.Xcal.slice(n * NIN, (n + 1) * NIN), v => v / 16));
const KB = 1.380649e-23;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

const C = { volt:"#ff8a4c", voltD:"#5a2a10", amp:"#6d9bff", ampD:"#16285a", ok:"#5fd38d", bad:"#ff5d6c", fg:"#ececec", muted:"#9a9a9a", dim:"#5e5e5e", line:"#262626" };

/* ---------------- digital network ---------------- */
const PARAMS = {};
for (const m of ["std", "hwa"]) PARAMS[m] = D.params[m].map(L => ({ W: Float64Array.from(L.W.flat()), b: Float64Array.from(L.b), nin: L.W.length, nout: L.b.length }));

function digital(m, x) {
  const P = PARAMS[m]; let h = x; const pres = [], acts = [x];
  P.forEach((L, li) => {
    const z = new Float64Array(L.nout);
    for (let j = 0; j < L.nout; j++) { let s = L.b[j]; for (let i = 0; i < L.nin; i++) s += h[i] * L.W[i * L.nout + j]; z[j] = s; }
    pres.push(z);
    h = li < P.length - 1 ? z.map(v => Math.max(0, v)) : z;
    acts.push(h);
  });
  return { out: h, pres, acts };
}

/* ---------------- RNG ---------------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gaussFrom(rng) { return () => { let u = 0; while (u === 0) u = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng()); }; }

/* ---------------- analog chip (sim.py 와 같은 모델) ---------------- */
const BASE = { Gmax: 100e-6, Gmin: 1e-6, Vread: 0.2, dac: 8, T: 300, B: 1e8 };

function buildChip(m, cfg, seed) {
  const P = PARAMS[m], g = gaussFrom(mulberry32(seed * 2654435761 + 17));
  const cal = Xcal.map(x => digital(m, x).acts);
  const { Gmax, Gmin } = BASE, Lv = cfg.levels;
  const lvl = a => Lv ? Math.round(a * (Lv - 1)) / (Lv - 1) : a;
  const layers = P.map((L, li) => {
    let mx = 1e-6; for (const a of cal) for (const v of a[li]) if (v > mx) mx = v;
    const xmax = 1.2 * mx, Nin = L.nin + 1, Nout = L.nout;
    const Wa = new Float64Array(Nin * Nout);
    for (let i = 0; i < L.nin; i++) for (let j = 0; j < Nout; j++) Wa[i * Nout + j] = L.W[i * Nout + j];
    for (let j = 0; j < Nout; j++) Wa[L.nin * Nout + j] = L.b[j] / xmax;
    let wmax = 0; for (const v of Wa) wmax = Math.max(wmax, Math.abs(v));
    const Gpt = new Float64Array(Nin * Nout), Gnt = new Float64Array(Nin * Nout), Gp = new Float64Array(Nin * Nout), Gn = new Float64Array(Nin * Nout), A = new Float64Array(Nin * Nout);
    for (let i = 0; i < Nin; i++) for (let j = 0; j < Nout; j++) {
      const k = i * Nout + j, w = Wa[k];
      Gpt[k] = Gmin + (Gmax - Gmin) * lvl(Math.max(w, 0) / wmax);
      Gnt[k] = Gmin + (Gmax - Gmin) * lvl(Math.max(-w, 0) / wmax);
      A[k] = 1 - cfg.beta * 0.5 * ((j + 1) / Nout + (Nin - i) / Nin);
    }
    for (let k = 0; k < Gp.length; k++) Gp[k] = Math.max(0, Gpt[k] * (1 + cfg.sigma * g()));
    for (let k = 0; k < Gn.length; k++) Gn[k] = Math.max(0, Gnt[k] * (1 + cfg.sigma * g()));
    const sumP = new Float64Array(Nout), sumN = new Float64Array(Nout);
    for (let i = 0; i < Nin; i++) for (let j = 0; j < Nout; j++) { sumP[j] += Gp[i * Nout + j]; sumN[j] += Gn[i * Nout + j]; }
    const s_in = BASE.Vread / xmax;
    let FS = 0;
    for (const a of cal) {
      const x = a[li];
      for (let j = 0; j < Nout; j++) {
        let s = 0; for (let i = 0; i < L.nin; i++) s += x[i] * s_in * (Gpt[i * Nout + j] - Gnt[i * Nout + j]);
        s += xmax * s_in * (Gpt[L.nin * Nout + j] - Gnt[L.nin * Nout + j]);
        FS = Math.max(FS, Math.abs(s));
      }
    }
    return { Nin, Nout, xmax, wmax, Gpt, Gnt, Gp, Gn, A, sumP, sumN, k: (Gmax - Gmin) / wmax, s_in, FS: 1.2 * FS, last: li === P.length - 1, cal: null };
  });
  return { m, cfg, seed, layers };
}

function runLayer(chip, L, h, g, detail) {
  const c = chip.cfg, { Nin, Nout } = L, Vr = BASE.Vread;
  const V = new Float64Array(Nin);
  for (let i = 0; i < Nin; i++) {
    let v = Math.min(Vr, Math.max(0, (i < Nin - 1 ? h[i] : L.xmax) * L.s_in));
    if (c.dac) { const q = 2 ** c.dac - 1; v = Math.round(v / Vr * q) / q * Vr; }
    V[i] = v;
  }
  const Ip = new Float64Array(Nout), In = new Float64Array(Nout);
  let cellP, cellN;
  if (detail) { cellP = new Float64Array(Nin * Nout); cellN = new Float64Array(Nin * Nout); }
  for (let i = 0; i < Nin; i++) { const v = V[i]; if (!v) continue;
    for (let j = 0; j < Nout; j++) { const k = i * Nout + j, ip = v * L.Gp[k] * L.A[k], inn = v * L.Gn[k] * L.A[k]; Ip[j] += ip; In[j] += inn; if (detail) { cellP[k] = ip; cellN[k] = inn; } } }
  const tn = c.thermal === false ? 0 : Math.sqrt(4 * KB * BASE.T * BASE.B);
  const Ipre = new Float64Array(Nout), Iq = new Float64Array(Nout), z = new Float64Array(Nout);
  const bits = c.adc, q = L.FS / (2 ** (bits - 1));
  for (let j = 0; j < Nout; j++) {
    Ip[j] += tn * Math.sqrt(L.sumP[j]) * g(); In[j] += tn * Math.sqrt(L.sumN[j]) * g();
    let I = Ip[j] - In[j] + c.read * L.FS * g();
    Ipre[j] = I;
    I = Math.min(L.FS, Math.max(-L.FS, Math.round(I / q) * q));
    Iq[j] = I;
    let v = I / (L.k * L.s_in);
    if (L.cal) v = v * L.cal.g[j] + L.cal.o[j];
    z[j] = v;
  }
  return detail ? { V, cellP, cellN, Ip, In, Ipre, Iq, z } : { z };
}

function runChip(chip, x, noiseSeed, detail) {
  const g = gaussFrom(mulberry32(noiseSeed)); let h = x; const steps = [];
  for (const L of chip.layers) {
    const r = runLayer(chip, L, h, g, detail); r.hin = h; steps.push(r);
    h = L.last ? r.z : r.z.map(v => Math.max(0, v));
  }
  return { out: h, steps };
}

function calibrate(chip) {
  const P = PARAMS[chip.m], g = gaussFrom(mulberry32(chip.seed * 7919 + 13));
  let H = Xcal;
  chip.layers.forEach((L, li) => {
    L.cal = null;
    const Zs = H.map(h => runLayer(chip, L, h, g, false).z);
    const W = P[li], gg = new Float64Array(L.Nout), oo = new Float64Array(L.Nout);
    for (let j = 0; j < L.Nout; j++) {
      let sx = 0, sy = 0, sxx = 0, sxy = 0; const n = H.length;
      H.forEach((h, s) => { let t = W.b[j]; for (let i = 0; i < W.nin; i++) t += h[i] * W.W[i * W.nout + j]; const x = Zs[s][j]; sx += x; sy += t; sxx += x * x; sxy += x * t; });
      const den = n * sxx - sx * sx;
      gg[j] = Math.abs(den) > 1e-12 ? (n * sxy - sx * sy) / den : 1;
      oo[j] = (sy - gg[j] * sx) / n;
    }
    L.cal = { g: gg, o: oo };
    H = Zs.map(z => { const v = z.map((x, j) => x * gg[j] + oo[j]); return L.last ? v : v.map(u => Math.max(0, u)); });
  });
}

/* ---------------- state ---------------- */
const PRESETS = {
  ideal:   { sigma: 0,  levels: 0,  adc: 10, dac: 0, beta: 0,  read: 0 },
  nominal: { sigma: 5,  levels: 32, adc: 8,  dac: 8, beta: 5,  read: 0.2 },
  bad:     { sigma: 30, levels: 8,  adc: 4,  dac: 4, beta: 15, read: 2 },
};

/* 그린 그림 → 학습 데이터와 같은 8×8, 0~16 형식
   (원본 데이터: 32×32 흑백 비트맵을 4×4 블록으로 나눠 켜진 픽셀 수를 셈) */
function padTo8x8() {
  const d = pctx.getImageData(0, 0, 256, 256).data;
  let x0 = 256, y0 = 256, x1 = -1, y1 = -1;
  for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) if (d[(y * 256 + x) * 4] > 128) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return null;
  const w = x1 - x0 + 1, h = y1 - y0 + 1, side = Math.max(w, h), sc = 32 / side;
  const tmp = document.createElement("canvas"); tmp.width = 32; tmp.height = 32;
  const t = tmp.getContext("2d"); t.fillStyle = "#000"; t.fillRect(0, 0, 32, 32); t.imageSmoothingQuality = "high";
  // 학습 데이터의 숫자는 좁은 획(1 등)도 가로로 여러 칸을 차지한다 → 너무 좁으면 가로로 늘려서 맞춤
  const dw = Math.max(w * sc, Math.min(32, h * sc * 0.3)), dh = h * sc;
  t.drawImage(pcv, x0, y0, w, h, (32 - dw) / 2, (32 - dh) / 2, dw, dh);
  const b = t.getImageData(0, 0, 32, 32).data;
  // 학습 데이터는 획이 굵다 (숫자마다 잉크 양이 비슷: 켜진 픽셀 약 310개/1024).
  // 그린 획이 가늘면 잉크 양이 비슷해질 때까지 획을 한 칸씩 굵게 만든다.
  let m = new Uint8Array(1024);
  for (let i = 0; i < 1024; i++) m[i] = b[i * 4] > 100 ? 1 : 0;
  const TARGET = 300;
  for (let it = 0; it < 6; it++) {
    let on = 0; for (const v of m) on += v;
    if (on >= TARGET) break;
    const n = m.slice();
    for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) if (m[y * 32 + x]) {
      if (x > 0) n[y * 32 + x - 1] = 1; if (x < 31) n[y * 32 + x + 1] = 1;
      if (y > 0) n[(y - 1) * 32 + x] = 1; if (y < 31) n[(y + 1) * 32 + x] = 1;
    }
    m = n;
  }
  const out = new Float64Array(64);
  for (let by = 0; by < 8; by++) for (let bx = 0; bx < 8; bx++) {
    let on = 0;
    for (let yy = 0; yy < 4; yy++) for (let xx = 0; xx < 4; xx++) on += m[(by * 4 + yy) * 32 + bx * 4 + xx];
    out[by * 8 + bx] = on / 16;
  }
  return out;
}
function padInfer() {
  const x = padTo8x8(); if (!x) return;

  steps.querySelectorAll("button").forEach((b, i) => { b.textContent = stageName(i); b.classList.toggle("done", i < S.stage); i === S.stage ? b.setAttribute("aria-current", "step") : b.removeAttribute("aria-current"); });

  if (stage > 4) { if (layer < 2) { layer++; stage = 0; } else { stage = 4; return false; } }
  if (stage < 0) { if (layer > 0) { layer--; stage = 4; } else { stage = 0; return false; } }

let raf = 0, last = 0;
const STAGE_MS = 1300;

  S.playing = true; S.t = 0; last = performance.now(); updateNav(); renderExplain();

  draw();
  if (S.t >= 1 && isDone()) updateReveal();
  if (S.t >= 1) {

/* ---------------- canvas drawing ---------------- */
const cv = $("cv"), ctx = cv.getContext("2d");
let geo = null;

  const w = cv.clientWidth, h = Math.max(420, Math.min(760, w * 0.52, innerHeight - 290)), dpr = devicePixelRatio || 1;
  cv.style.height = h + "px"; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);

}
const mix = (a, b, t) => { const p = x => [1, 3, 5].map(i => parseInt(x.slice(i, i + 2), 16)); const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",")})`; };

  const W = cv.clientWidth, H = cv.clientHeight; if (!W) return;
  ctx.clearRect(0, 0, W, H);
  const L = chip.layers[S.layer], st = run.steps[S.layer], { Nin, Nout } = L;
  const stage = S.stage, t = ease(S.t);
  const showDigit = S.layer === 0 && W >= 560;
  const left = showDigit ? 132 : 46, right = 10, top = 14, gap = 14;
  const outH = 104, barH = 56, botPad = 16;
  const arrH = H - top - outH - barH - botPad - 22;

  const xP = left, xN = left + Nout * cw + gap, yA = top, yBar = yA + arrH + 12, yOut = yBar + barH + 14;
  geo = { xP, xN, yA, cw, ch, Nin, Nout };

  // input digit for layer 1
  if (showDigit) {
    const s = 9, ix = 4, iy = yA + arrH / 2 - 4 * s, x = curX();
    for (let k = 0; k < 64; k++) { const v = Math.round(x[k] * 255); ctx.fillStyle = `rgb(${v},${v},${v})`; ctx.fillRect(ix + (k % 8) * s, iy + Math.floor(k / 8) * s, s, s); }

  }
  // DAC input bars (row voltages)
  const vin = stage === 0 ? t : 1;
  for (let i = 0; i < Nin; i++) {
    const y = yA + i * ch, f = st.V[i] / Vr, bias = i === Nin - 1;
    ctx.fillStyle = "#141414"; ctx.fillRect(left - 34, y + ch * .1, 26, Math.max(1, ch * .8));
    ctx.fillStyle = bias ? C.ok : C.volt; ctx.fillRect(left - 34, y + ch * .1, 26 * f * vin, Math.max(1, ch * .8));

  ctx.lineWidth = Math.max(.4, Math.min(1, ch * .15));

}

cv.addEventListener("mousemove", e => {

  const { xP, xN, yA, cw, ch, Nin, Nout } = geo; let j = null, i = null;

  if (j == null) return;

  S.focus = { i, j }; if (!S.playing) draw(); renderExplain();
});
cv.addEventListener("mouseleave", () => { S.focus = null; if (!S.playing) draw(); renderExplain(); });

/* ---------------- explanation panel ---------------- */
const uA = I => Math.abs(I) >= 1e-3 ? (I * 1e3).toFixed(3) + " mA" : (I * 1e6).toFixed(2) + " µA";
function focusCol(st) { if (S.focus) return S.focus.j; let b = 0; for (let j = 1; j < st.z.length; j++) if (Math.abs(st.z[j]) > Math.abs(st.z[b])) b = j; return b; }
function focusRow(L, st, j) { if (S.focus && S.focus.i != null) return S.focus.i; let b = 0, bv = -1; for (let i = 0; i < L.Nin - 1; i++) { const v = st.cellP[i * L.Nout + j] + st.cellN[i * L.Nout + j]; if (v > bv) { bv = v; b = i; } } return b; }
function renderExplain() {
  if (!run) return;
  const L = chip.layers[S.layer], st = run.steps[S.layer], j = focusCol(st), i = focusRow(L, st, j), k = i * L.Nout + j;
  const rowName = i === L.Nin - 1 ? "bias" : `[${i}, ${j}]`;
  let eq = "";
  if (S.stage === 0) {
    eq = `<span class="m">${i === L.Nin - 1 ? "bias" : "row " + i}</span>\nx = ${i === L.Nin - 1 ? "1" : (st.hin[i]).toFixed(3)}\n<span class="v">V = ${(st.V[i] * 1000).toFixed(1)} mV</span>`;
  } else if (S.stage === 1) {
    eq = `<span class="m">${rowName}</span>\n<span class="v">G⁺ ${(L.Gp[k] * 1e6).toFixed(1)} µS</span>\n<span class="a">G⁻ ${(L.Gn[k] * 1e6).toFixed(1)} µS</span>\nI = G·V\nI⁺ ${uA(st.cellP[k])}\nI⁻ ${uA(st.cellN[k])}`;
  } else if (S.stage === 2) {
    eq = `<span class="m">col ${j}</span>\n<span class="v">ΣG⁺V = ${uA(st.Ip[j])}</span>\n<span class="a">ΣG⁻V = ${uA(st.In[j])}</span>`;
  } else if (S.stage === 3) {
    eq = `<span class="m">#${j}</span>\nI⁺ − I⁻ = ${uA(st.Ipre[j])}\nADC ${chip.cfg.adc}b → ${uA(st.Iq[j])}\nz = ${st.z[j].toFixed(3)}\n<span class="a">digital ${dig.pres[S.layer][j].toFixed(3)}</span>`;
  } else if (L.last) {
    const p = argmax(run.out), tr = curLabel();
    eq = tr == null ? `<span class="g">→ ${p}</span>` : `<span class="${p === tr ? "g" : "v"}">→ ${p}</span>\n<span class="m">true ${tr}</span>`;
  } else {
    const neg = Array.from(st.z).filter(v => v < 0).length;
    eq = `max(0, z)\n<span class="m">${neg}/${L.Nout} → 0</span>`;
  }
  $("exTitle").textContent = ""; $("exEq").innerHTML = eq.split("\n").map(x => x.startsWith("<span") ? x : `<span>${x}</span>`).join("");
}

/* ---------------- results ---------------- */
function softmax(z) { const m = Math.max(...z), e = Array.from(z, v => Math.exp(v - m)), s = e.reduce((a, b) => a + b, 0); return e.map(v => v / s); }
function relErr(a, b) { let n = 0, d = 0; for (let i = 0; i < a.length; i++) { n += (a[i] - b[i]) ** 2; d += b[i] ** 2; } return Math.sqrt(n / Math.max(d, 1e-12)); }
function renderResults() {
  const pa = softmax(run.out), pd = softmax(dig.out), tr = curLabel(), ca = argmax(run.out), cd = argmax(dig.out);
  const good = tr == null || ca === tr;
  $("pred").innerHTML = `<span style="color:${good ? C.ok : C.bad}">${ca}</span>` + (tr == null ? `<small title="직접 그린 숫자">✎</small>` : `<small title="정답">${ca === tr ? "✓" : "✗"} ${tr}</small>`);
  const box = $("probs"); box.innerHTML = "";
  const H = 58;
  for (let k = 0; k < 10; k++) {
    const r = document.createElement("div"); r.className = "pc" + (k === tr ? " t" : "");
    r.innerHTML = `<div class="d" style="height:${(pd[k] * H).toFixed(1)}px"></div><div class="an" style="height:${(pa[k] * H).toFixed(1)}px;background:${k === ca ? (good ? C.ok : C.bad) : C.volt}"></div><span>${k}</span>`;
    box.append(r);
  }
  const le = $("lerr"); le.innerHTML = "";
  run.steps.forEach((s, li) => {
    const e = relErr(s.z, dig.pres[li]) * 100;
    const r = document.createElement("div");
    r.innerHTML = `<em>${e.toFixed(1)}%</em><i style="height:${Math.min(44, e * 0.9).toFixed(1)}px"></i><span>L${li + 1}</span>`;
    le.append(r);
  });
}
let accTimer = 0;
function scheduleAccuracy() { clearTimeout(accTimer); $("accA").textContent = "…"; accTimer = setTimeout(computeAccuracy, 120); }
function computeAccuracy() {
  let a = 0, d = 0;
  for (let n = 0; n < NTE; n++) { const o = runChip(chip, Xte[n], S.seed * 100003 + n, false).out; if (argmax(o) === D.yte[n]) a++; if (argmax(digital(S.model, Xte[n]).out) === D.yte[n]) d++; }
  $("accD").textContent = (d / NTE * 100).toFixed(1) + "%"; $("accA").textContent = (a / NTE * 100).toFixed(1) + "%";

}

/* ---------------- boot ---------------- */
syncControls(); pickedUI(); updateNav();
addEventListener("resize", resize);
rebuild(); resize();
startPlay(true);
window.__sim = { buildChip, runChip, digital, calibrate, Xte, D, S, get chip() { return chip; } };
})();
</script>
